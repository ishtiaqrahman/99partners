[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ninety-nine-workbench"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["duckdb==1.4.4", "fastapi==0.141.1", "uvicorn==0.52.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]
browser = ["playwright==1.62.0"]

[project.scripts]
workbench = "workbench.pipeline:main"

[tool.setuptools.package-data]
workbench = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
